name: Update bindings

on:
  workflow_call:
    inputs:
      branch:
        description: "Target branch"
        default: "dev"
        required: true
        type: string
    outputs:
      published:
        description: "Whether a PR was created for the target branch"
        value: ${{ jobs.publish-pr.outputs.published == 'true' && 'true' || 'false' }}

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: arm-unknown-linux-gnueabi,  os: ubuntu-latest }
          - { target: aarch64-apple-darwin,       os: macos-latest }
          - { target: x86_64-apple-darwin,        os: macos-latest }
          - { target: x86_64-pc-windows-msvc,     os: windows-latest }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest }
          - { target: i686-pc-windows-msvc,       os: windows-latest }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Install cross-compilers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -yq gcc-14-aarch64-linux-gnu gcc-14-arm-linux-gnueabi

      - name: Update Bindings
        run: cargo run -p update-bindings -- -b -d -t ${{ matrix.target }}

      - name: Pack Changes
        id: pack-changes
        shell: bash
        run: |
          git add .
          CHANGED=($(git diff --name-only --staged | xargs))
          if [ ${#CHANGED[@]} -gt 0 ]; then
            tar -czf update-${{ matrix.target }}.tar.gz ${CHANGED[@]}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Artifact
        if: steps.pack-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: update-${{ matrix.target }}
          path: update-${{ matrix.target }}.tar.gz

  merge-and-publish:
    runs-on: ubuntu-latest
    needs: update
    outputs:
      published: ${{ steps.publish-pr.outputs.published == 'true' && 'true' || 'false' }}

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: update-*
          merge-multiple: true

      - name: Check for changes
        id: check
        run: |
          shopt -s nullglob
          FILES=(update-*.tar.gz)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No changes across any target"
            exit 0
          fi
          mkdir merged && cd merged
          for f in "${FILES[@]}"; do
            tar -xzf "../$f" && rm "../$f"
          done
          tar -czf ../merge-changes.tar.gz .
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.check.outputs.has_changes == 'true'
        with:
          ref: ${{ inputs.branch }}

      - name: Publish PR
        id: publish-pr
        if: steps.check.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_BRANCH=${{ inputs.branch == 'dev' && 'update-bindings' || inputs.branch }}
          ${{ inputs.branch == 'dev' && 'git switch -c ${SOURCE_BRANCH}' || 'echo "Re-using ${SOURCE_BRANCH}"' }}
          RESET_REV=$(git rev-parse HEAD)

          tar -xzf merge-changes.tar.gz && rm merge-changes.tar.gz
          git reset ${RESET_REV}
          git add .

          CHANGED=($(git diff --name-only --staged | xargs))
          if [ ${#CHANGED[@]} -gt 0 ]; then
            git push --force -u origin ${SOURCE_BRANCH}

            FILES=()
            for VALUE in ${CHANGED[@]}; do
              base64 -w0 "${VALUE}" > "${VALUE}.base64"
              FILES+=("-F" "files[][path]=${VALUE}" "-F" "files[][contents]=@${VALUE}.base64")
            done

            gh api graphql \
              -F githubRepository=${GITHUB_REPOSITORY} \
              -F branchName=${SOURCE_BRANCH} \
              -F expectedHeadOid=${RESET_REV} \
              -F 'commitMessage=chore: update bindings' \
              -F query=@.github/api/createCommitOnBranch.graphql \
              ${FILES[@]}

            git pull
            gh pr create -f
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
