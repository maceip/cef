name: cefheadless CDP trace compare

on:
  workflow_dispatch:
    inputs:
      cefheadless_path:
        description: "Path to cefheadless binary"
        required: false
        default: "./out/Release_GN_x64/cefheadless"
      cdp_port:
        description: "CDP port to use"
        required: false
        default: "9222"

jobs:
  compare-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate helper script exists
        run: |
          test -x tools/cefheadless_cdp_trace_compare.sh

      - name: Run good/bad trace capture (if binary present)
        env:
          CEFHEADLESS_PATH: ${{ github.event.inputs.cefheadless_path }}
          CDP_PORT: ${{ github.event.inputs.cdp_port }}
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/cdp-artifacts"
          mkdir -p "$ARTIFACT_DIR"
          if [[ ! -x "$CEFHEADLESS_PATH" ]]; then
            echo "cefheadless binary not found or not executable at: $CEFHEADLESS_PATH"
            echo "Provide a valid path via workflow_dispatch input." | tee "$ARTIFACT_DIR/error.txt"
            exit 0
          fi
          tools/cefheadless_cdp_trace_compare.sh "$CEFHEADLESS_PATH" "$CDP_PORT" "$ARTIFACT_DIR"
          ls -la "$ARTIFACT_DIR"

      - name: Upload trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cefheadless-cdp-traces
          path: ${{ runner.temp }}/cdp-artifacts/
