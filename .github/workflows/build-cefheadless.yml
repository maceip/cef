name: Build CEF

on:
  workflow_dispatch:

env:
  DOWNLOAD_DIR: /home/runner/cef-build
  GN_DEFINES: "is_official_build=true use_sysroot=true proprietary_codecs=true ffmpeg_branding=Chrome ozone_platform_x11=false"
  AWS_REGION: eu-central-1

jobs:
  pre-warm:
    runs-on: ubuntu-latest
    steps:
      - name: Scale up runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -q awscli
          X86_ASG=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name CefRunners \
            --query "Stacks[0].Outputs[?OutputKey=='X86AsgName'].OutputValue" --output text)
          aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
            --auto-scaling-group-name "$X86_ASG" --min-size 1 --desired-capacity 1

  build:
    needs: [pre-warm]
    runs-on: [self-hosted, linux, x64, cef-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          path: cef-src

      - name: Fetch + sync + patch (upstream CEF)
        run: |
          set -euxo pipefail
          export PATH="$DOWNLOAD_DIR/depot_tools:$PATH"
          export GCLIENT_SYNC_JOBS=4
          mkdir -p "$DOWNLOAD_DIR"

          python3 cef-src/tools/automate/automate-git.py \
            --download-dir="$DOWNLOAD_DIR" \
            --branch=master \
            --x64-build \
            --build-target=cef \
            --with-pgo-profiles \
            --no-debug-build \
            --no-distrib \
            --no-chromium-history \
            --no-build \
            2>&1 | tee /tmp/cef-build.log

      - name: Overlay fork-specific files
        run: |
          CEF_SRC="$DOWNLOAD_DIR/chromium/src/cef"

          # Patch X11 out of menu_runner_views_aura.cc
          F="$CEF_SRC/libcef/browser/native/menu_runner_views_aura.cc"
          sed -i 's|^#include "ui/gfx/x/connection.h"|#if defined(USE_X11)\n#include "ui/gfx/x/connection.h"\n#endif|' "$F"
          sed -i 's|^#if BUILDFLAG(IS_LINUX)$|#if BUILDFLAG(IS_LINUX) \&\& defined(USE_X11)|' "$F"

          # Add cefheadless target: copy sources + register in BUILD.gn and gypi
          mkdir -p "$CEF_SRC/tests/cefheadless"
          cp cef-src/tests/cefheadless/*.cc cef-src/tests/cefheadless/*.h "$CEF_SRC/tests/cefheadless/"

          # Add cefheadless entries to cef_paths2.gypi if not already there
          if ! grep -q "cefheadless_sources" "$CEF_SRC/cef_paths2.gypi"; then
            # Insert before the closing brace of the top-level dict
            sed -i '/^}$/i\
    '"'"'cefheadless_sources_common'"'"': [\
      '"'"'tests/cefheadless/headless_app.cc'"'"',\
      '"'"'tests/cefheadless/headless_app.h'"'"',\
      '"'"'tests/cefheadless/headless_handler.cc'"'"',\
      '"'"'tests/cefheadless/headless_handler.h'"'"',\
    ],\
    '"'"'cefheadless_sources_linux'"'"': [\
      '"'"'tests/cefheadless/cefheadless_linux.cc'"'"',\
    ],' "$CEF_SRC/cef_paths2.gypi"
          fi

          # Add cefheadless executable target to BUILD.gn if not already there
          if ! grep -q 'executable("cefheadless")' "$CEF_SRC/BUILD.gn"; then
            cat >> "$CEF_SRC/BUILD.gn" << 'BUILDGN'

          # cefheadless target (appended by CI)
          executable("cefheadless") {
            testonly = true
            sources = includes_common +
                      gypi_paths2.includes_wrapper +
                      gypi_paths2.cefheadless_sources_common
            deps = [
              ":libcef",
              ":libcef_dll_wrapper",
            ]
            defines = [ "CEF_USE_SANDBOX" ]
            use_libcxx_modules = false
            if (is_linux) {
              sources += includes_linux +
                         gypi_paths2.cefheadless_sources_linux
              if (!is_component_build) {
                configs += [ "//build/config/gcc:rpath_for_built_shared_libraries" ]
              }
            }
          }
          BUILDGN
          fi

          # Add cefheadless to the cef group deps
          if ! grep -q ':cefheadless' "$CEF_SRC/BUILD.gn"; then
            sed -i '/:cefsimple/a\    ":cefheadless",' "$CEF_SRC/BUILD.gn"
          fi

      - name: GN gen + build
        run: |
          set -euxo pipefail
          export PATH="$DOWNLOAD_DIR/depot_tools:$PATH"
          cd "$DOWNLOAD_DIR/chromium/src"

          export GN_DEFINES
          python3 cef/tools/gclient_hook.py

          autoninja -C out/Release_GN_x64 cef chrome_sandbox \
            2>&1 | tee /tmp/cef-ninja.log || {
              echo "=== LAST 100 LINES ==="
              tail -100 /tmp/cef-ninja.log
              exit 1
            }

      - name: Upload binary to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd "$DOWNLOAD_DIR/chromium/src/out/Release_GN_x64"
          ls -la cefheadless cefsimple libcef.so chrome_sandbox 2>&1 || true
          tar czf /tmp/cefheadless-dist.tar.gz \
            --ignore-failed-read \
            cefheadless cefsimple libcef.so chrome_sandbox \
            icudtl.dat v8_context_snapshot.bin \
            *.pak locales/ 2>&1 || true
          aws s3 cp /tmp/cefheadless-dist.tar.gz \
            s3://cef-build-cache-${{ secrets.AWS_ACCOUNT_ID }}/dist/cefheadless-latest.tar.gz \
            --region "$AWS_REGION"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-build-log
          path: |
            /tmp/cef-build.log
            /tmp/cef-ninja.log

  scale-down:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Scale down
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -q awscli
          X86_ASG=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name CefRunners \
            --query "Stacks[0].Outputs[?OutputKey=='X86AsgName'].OutputValue" --output text)
          aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
            --auto-scaling-group-name "$X86_ASG" --min-size 0 --desired-capacity 0
