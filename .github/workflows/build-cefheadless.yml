name: Build CEF

on:
  workflow_dispatch:

env:
  DOWNLOAD_DIR: /home/runner/cef-build
  GN_DEFINES: "is_official_build=true use_sysroot=true proprietary_codecs=true ffmpeg_branding=Chrome use_x11=false ozone_platform_x11=false"
  AWS_REGION: eu-central-1

jobs:
  pre-warm:
    runs-on: ubuntu-latest
    steps:
      - name: Scale up runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -q awscli
          X86_ASG=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name CefRunners \
            --query "Stacks[0].Outputs[?OutputKey=='X86AsgName'].OutputValue" --output text)
          aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
            --auto-scaling-group-name "$X86_ASG" --min-size 1 --desired-capacity 1

  build:
    needs: [pre-warm]
    runs-on: [self-hosted, linux, x64, cef-builder]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          path: cef-src

      - name: Build
        run: |
          set -euxo pipefail
          export PATH="$DOWNLOAD_DIR/depot_tools:$PATH"
          export GCLIENT_SYNC_JOBS=8
          mkdir -p "$DOWNLOAD_DIR"

          python3 cef-src/tools/automate/automate-git.py \
            --download-dir="$DOWNLOAD_DIR" \
            --branch=master \
            --x64-build \
            --build-target=cef \
            --no-debug-build \
            --force-build \
            --no-distrib \
            --no-chromium-history \
            --build-log-file \
            2>&1 | tee /tmp/cef-build.log || {
              echo "=== NINJA BUILD LOG (last 200 lines) ==="
              tail -200 "$DOWNLOAD_DIR/build-master-release.log" 2>/dev/null || true
              exit 1
            }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-build-log
          path: |
            /tmp/cef-build.log
            ${{ env.DOWNLOAD_DIR }}/build-master-*.log

  scale-down:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Scale down
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -q awscli
          X86_ASG=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name CefRunners \
            --query "Stacks[0].Outputs[?OutputKey=='X86AsgName'].OutputValue" --output text)
          aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
            --auto-scaling-group-name "$X86_ASG" --min-size 0 --desired-capacity 0
