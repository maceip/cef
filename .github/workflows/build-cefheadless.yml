name: Build CEF

on:
  workflow_dispatch:

env:
  DOWNLOAD_DIR: /home/runner/cef-build
  GN_DEFINES: "is_official_build=true use_sysroot=true proprietary_codecs=true ffmpeg_branding=Chrome ozone_platform_x11=false"
  AWS_REGION: eu-central-1

jobs:
  pre-warm:
    runs-on: ubuntu-latest
    steps:
      - name: Scale up runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -q awscli
          X86_ASG=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name CefRunners \
            --query "Stacks[0].Outputs[?OutputKey=='X86AsgName'].OutputValue" --output text)
          aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
            --auto-scaling-group-name "$X86_ASG" --min-size 1 --desired-capacity 1

  build:
    needs: [pre-warm]
    runs-on: [self-hosted, linux, x64, cef-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          path: cef-src

      - name: Fetch + sync + patch + GN gen (no build)
        run: |
          set -euxo pipefail
          export PATH="$DOWNLOAD_DIR/depot_tools:$PATH"
          export GCLIENT_SYNC_JOBS=4
          mkdir -p "$DOWNLOAD_DIR"

          # Skip full automate-git.py if checkout already exists (avoids gclient sync)
          if [[ -d "$DOWNLOAD_DIR/chromium/src/cef" ]]; then
            echo "Existing checkout found — skipping sync, just re-copying CEF source"
            # Re-copy our CEF fork into the checkout
            rm -rf "$DOWNLOAD_DIR/chromium/src/cef"
            cp -a "$DOWNLOAD_DIR/cef" "$DOWNLOAD_DIR/chromium/src/cef"
          else
            python3 cef-src/tools/automate/automate-git.py \
              --download-dir="$DOWNLOAD_DIR" \
              --branch=master \
              --x64-build \
              --build-target=cef \
              --with-pgo-profiles \
              --no-debug-build \
              --no-distrib \
              --no-chromium-history \
              --no-build \
              2>&1 | tee /tmp/cef-build.log
          fi

      - name: Patch CEF source for headless build
        run: |
          CEF_SRC="$DOWNLOAD_DIR/chromium/src/cef"

          # Patch X11 out of menu_runner_views_aura.cc
          F="$CEF_SRC/libcef/browser/native/menu_runner_views_aura.cc"
          sed -i 's|^#include "ui/gfx/x/connection.h"|#if defined(USE_X11)\n#include "ui/gfx/x/connection.h"\n#endif|' "$F"
          sed -i 's|^#if BUILDFLAG(IS_LINUX)$|#if BUILDFLAG(IS_LINUX) \&\& defined(USE_X11)|' "$F"

          # Overlay our fork's files on top of the upstream CEF checkout.
          # This brings in cefheadless, BUILD.gn changes, custom APIs, etc.
          # Use rsync to merge without deleting upstream-only files.
          rsync -a --exclude='.git' cef-src/ "$CEF_SRC/"

      - name: GN gen + build
        run: |
          set -euxo pipefail
          export PATH="$DOWNLOAD_DIR/depot_tools:$PATH"
          cd "$DOWNLOAD_DIR/chromium/src"

          # Write args.gn directly (gclient_hook.py fails with our fork's version stamps)
          # Force GN to regenerate build.ninja (prior build used different BUILD.gn)
          rm -f out/Release_GN_x64/build.ninja out/Release_GN_x64/args.gn
          mkdir -p out/Release_GN_x64
          cat > out/Release_GN_x64/args.gn << 'ARGS'
          blink_heap_inside_shared_library=true
          clang_use_chrome_plugins=false
          disable_fieldtrial_testing_config=true
          enable_background_mode=false
          enable_backup_ref_ptr_support=false
          enable_downgrade_processing=false
          enable_linux_installer=false
          enable_resource_allowlist_generation=false
          enable_widevine=true
          ffmpeg_branding="Chrome"
          forbid_non_component_debug_builds=false
          is_component_build=false
          is_debug=false
          is_official_build=true
          ozone_platform_x11=false
          optimize_webui=true
          proprietary_codecs=true
          target_cpu="x64"
          use_partition_alloc_as_malloc=false
          use_qt5=false
          use_qt6=false
          use_sysroot=true
          ARGS
          gn gen out/Release_GN_x64

          # Debug: check if //cef is wired into root BUILD.gn
          grep -c '//cef' BUILD.gn || echo "WARNING: //cef not in root BUILD.gn"
          # List available cef targets
          gn ls out/Release_GN_x64 '//cef:*' 2>&1 | head -20 || true

          autoninja -C out/Release_GN_x64 cef/cefheadless cefsimple chrome_sandbox \
            2>&1 | tee /tmp/cef-ninja.log || {
              echo "=== LAST 100 LINES ==="
              tail -100 /tmp/cef-ninja.log
              exit 1
            }

      - name: Upload binary to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd "$DOWNLOAD_DIR/chromium/src/out/Release_GN_x64"
          ls -la cefheadless cefsimple libcef.so chrome_sandbox 2>&1 || true
          tar czf /tmp/cefheadless-dist.tar.gz \
            --ignore-failed-read \
            cefheadless cefsimple libcef.so chrome_sandbox \
            icudtl.dat v8_context_snapshot.bin \
            *.pak locales/ 2>&1 || true
          aws s3 cp /tmp/cefheadless-dist.tar.gz \
            s3://cef-build-cache-${{ secrets.AWS_ACCOUNT_ID }}/dist/cefheadless-latest.tar.gz \
            --region "$AWS_REGION"
          echo "Uploaded cefheadless-dist.tar.gz to S3"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-build-log
          path: |
            /tmp/cef-build.log
            /tmp/cef-ninja.log

  scale-down:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Scale down
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -q awscli
          X86_ASG=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name CefRunners \
            --query "Stacks[0].Outputs[?OutputKey=='X86AsgName'].OutputValue" --output text)
          aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
            --auto-scaling-group-name "$X86_ASG" --min-size 0 --desired-capacity 0
