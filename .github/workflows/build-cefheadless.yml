name: Build CEF

on:
  workflow_dispatch:

env:
  DOWNLOAD_DIR: /home/runner/cef-build
  GN_DEFINES: "is_official_build=true use_sysroot=true proprietary_codecs=true ffmpeg_branding=Chrome use_x11=false ozone_platform_x11=false"
  AWS_REGION: eu-central-1

jobs:
  pre-warm:
    runs-on: ubuntu-latest
    steps:
      - name: Scale up runner
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -q awscli
          X86_ASG=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name CefRunners \
            --query "Stacks[0].Outputs[?OutputKey=='X86AsgName'].OutputValue" --output text)
          aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
            --auto-scaling-group-name "$X86_ASG" --min-size 1 --desired-capacity 1

  build:
    needs: [pre-warm]
    runs-on: [self-hosted, linux, x64, cef-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          path: cef-src

      - name: Fetch + sync + patch (no build)
        run: |
          set -euxo pipefail
          export PATH="$DOWNLOAD_DIR/depot_tools:$PATH"
          export GCLIENT_SYNC_JOBS=8
          mkdir -p "$DOWNLOAD_DIR"

          python3 cef-src/tools/automate/automate-git.py \
            --download-dir="$DOWNLOAD_DIR" \
            --branch=master \
            --x64-build \
            --build-target=cef \
            --with-pgo-profiles \
            --no-debug-build \
            --no-distrib \
            --no-chromium-history \
            --no-build \
            2>&1 | tee /tmp/cef-build.log

      - name: Patch X11 out of menu_runner_views_aura.cc
        run: |
          F="$DOWNLOAD_DIR/chromium/src/cef/libcef/browser/native/menu_runner_views_aura.cc"
          # Gate X11 connection include on USE_X11
          sed -i 's|^#include "ui/gfx/x/connection.h"|#if defined(USE_X11)\n#include "ui/gfx/x/connection.h"\n#endif|' "$F"
          # Gate the X11 coordinate translation block
          sed -i 's|^#if BUILDFLAG(IS_LINUX)$|#if BUILDFLAG(IS_LINUX) \&\& defined(USE_X11)|' "$F"

      - name: Build
        run: |
          set -euxo pipefail
          export PATH="$DOWNLOAD_DIR/depot_tools:$PATH"

          cd "$DOWNLOAD_DIR/chromium/src"
          autoninja -C out/Release_GN_x64 cef chrome_sandbox \
            2>&1 | tee /tmp/cef-ninja.log || {
              echo "=== LAST 100 LINES ==="
              tail -100 /tmp/cef-ninja.log
              exit 1
            }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cef-build-log
          path: |
            /tmp/cef-build.log
            /tmp/cef-ninja.log

  scale-down:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Scale down
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          pip install -q awscli
          X86_ASG=$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name CefRunners \
            --query "Stacks[0].Outputs[?OutputKey=='X86AsgName'].OutputValue" --output text)
          aws autoscaling update-auto-scaling-group --region "$AWS_REGION" \
            --auto-scaling-group-name "$X86_ASG" --min-size 0 --desired-capacity 0
